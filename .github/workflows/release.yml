name: Release

# Tag-driven releases. The version comes entirely from the git tag — there is no
# manual `npm version` / package.json bump. Cutting a release is just:
#
#     git tag v1.0.0-beta.2 && git push origin v1.0.0-beta.2
#
# This workflow derives the version from the tag, injects it at build time via
# electron-builder's extraMetadata.version, builds the installers, and publishes
# them (plus latest.yml) to this repo's GitHub Releases.

on:
  push:
    tags:
      - 'v*'

# Lets the auto-provided GITHUB_TOKEN upload release assets to THIS repo — no
# personal publish token needed.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Verify before we ever cut installers: a broken tag should fail here, not
      # ship. `npm run build` (below) also runs the type check.
      - name: Lint
        shell: bash
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: npm test

      # Build the installers WITHOUT electron-builder's own uploader — its
      # GitHub publisher races the release creation in CI and can drop the
      # large .exe while still exiting 0. We publish deterministically below.
      # `--publish never` still writes dist/latest.yml because a `publish`
      # provider is configured in electron-builder.yml.
      - name: Build installers
        shell: bash
        run: |
          set -euo pipefail
          # Strip the leading "v": v1.0.0-beta.2 -> 1.0.0-beta.2
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building $VERSION"
          npm run build
          npx electron-builder --win --publish never -c.extraMetadata.version="$VERSION"
          echo "=== dist artifacts ==="
          ls -la dist

      # Create/update the GitHub Release for this tag and upload every updater
      # artifact (installer + blockmap + latest.yml) with the first-party gh CLI.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # A -beta/-rc suffix ships as a pre-release; a bare x.y.z as a release.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=--prerelease; else PRERELEASE=; fi
          FILES=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          echo "Uploading: ${FILES[*]}"
          # Idempotent: create on first run, clobber-upload on re-runs.
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --title "$VERSION" $PRERELEASE --notes "Automated release of $VERSION." \
            || gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
