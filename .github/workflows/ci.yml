name: CI

# Fast, platform-agnostic checks on every push to master and every PR: type
# checking, linting, unit tests and a full renderer/main/preload bundle. Tagged
# releases go through .github/workflows/release.yml (which reuses these checks).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
